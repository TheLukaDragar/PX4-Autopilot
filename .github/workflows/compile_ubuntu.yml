name: Ubuntu environment build

on:
  push:
    branches:
      - 'main'
      - 'stable'
      - 'beta'
      - 'release/**'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'

# Self-hosted: TheLukaDragar/PX4-Autopilot (or PX4_CI_SELF_HOSTED=true) uses labels from
# PX4_SELF_HOSTED_LABELS JSON; omit runs-on/action on that path. Fleet remains for PX4 upstream.
env:
  RUNS_IN_DOCKER: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        version: ['ubuntu:22.04', 'ubuntu:24.04']
    runs-on: >-
      ${{
        (github.repository == 'TheLukaDragar/PX4-Autopilot' || vars.PX4_CI_SELF_HOSTED == 'true')
        && fromJSON(vars.PX4_SELF_HOSTED_LABELS || '["self-hosted","Linux","X64"]')
        || fromJSON(format('["runs-on","runner=4cpu-linux-x64","image=ubuntu24-full-x64","run-id={0}","spot=false","extras=s3-cache"]', github.run_id))
      }}
    container:
      image: ${{ matrix.version }}
      volumes:
        - /github/workspace:/github/workspace
    steps:
      - uses: runs-on/action@v2
        if: ${{ !(github.repository == 'TheLukaDragar/PX4-Autopilot' || vars.PX4_CI_SELF_HOSTED == 'true') }}

      - name: Fix git in container
        run: |
          # we only need this because we are running the job in a container
          # when checkout pulls git it does it in a shared volume
          # and file ownership changes between steps
          # first we install git since its missing from the base image
          # then we mark the directory as safe for other instances
          # of git to use.
          apt update && apt install git -y
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v6

      - name: Use AWS regional apt mirror
        if: startsWith(runner.name, 'runs-on--')
        run: ./Tools/ci/use_aws_apt_mirror.sh

      - name: Install Deps
        run: ./Tools/setup/ubuntu.sh

      - uses: ./.github/actions/setup-ccache
        id: ccache
        with:
          cache-key-prefix: ccache-ubuntu-${{ matrix.version }}
          max-size: 200M

      - name: Build px4_sitl_default
        run: make px4_sitl_default

      - name: Build px4_fmu-v5_default
        run: make px4_fmu-v5_default

      - uses: ./.github/actions/save-ccache
        if: always()
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}
