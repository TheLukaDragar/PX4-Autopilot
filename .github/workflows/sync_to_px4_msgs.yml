# Self-hosted: for this fork, jobs use labels self-hosted + Linux + X64 (see runs-on).
# Other forks: set repo variable PX4_CI_SELF_HOSTED=true (optional: PX4_SELF_HOSTED_LABELS JSON array).
# Push requires secret GH_SYNC_TOKEN: classic PAT with `repo`, or fine-grained PAT with
# **Contents: Read-and-write** on the px4_msgs repository (PX4-Autopilot access alone is not enough).
# Never use workflows' default `GITHUB_TOKEN` for `git push`; it cannot write to px4_msgs.
name: Sync ROS 2 messages to px4_msgs
on:
  push:
    branches:
      - 'main'
      - 'stable'
      - 'beta'
      - 'release/**'
    paths:
      - 'msg/**'
      - 'srv/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_to_px4_msgs:
    if: github.repository == 'PX4/PX4-Autopilot' || github.repository == 'TheLukaDragar/PX4-Autopilot'
    runs-on: >-
      ${{
        (github.repository == 'TheLukaDragar/PX4-Autopilot' || vars.PX4_CI_SELF_HOSTED == 'true')
        && fromJSON(vars.PX4_SELF_HOSTED_LABELS || '["self-hosted","Linux","X64"]')
        || fromJSON(format('["runs-on","runner=4cpu-linux-x64","image=ubuntu22-full-x64","run-id={0}","spot=false"]', github.run_id))
      }}
    env:
      PX4_MSGS_REPO: TheLukaDragar/px4_msgs
    steps:
      - name: Checkout PX4 repo
        uses: actions/checkout@v6

      - name: Check px4_msgs push token
        if: github.repository == 'TheLukaDragar/PX4-Autopilot' || vars.PX4_CI_SELF_HOSTED == 'true'
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          PX4_BUILDBOT_TOKEN: ${{ secrets.PX4BUILDBOT_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "${GH_SYNC_TOKEN}" ] && [ -z "${PX4_BUILDBOT_TOKEN}" ]; then
            echo "::error::Add repository secret GH_SYNC_TOKEN (PAT with push access to ${PX4_MSGS_REPO})."
            exit 1
          fi

      - name: Setup git credentials
        run: |
          git config --global user.name "${{ secrets.GH_SYNC_USER || secrets.PX4BUILDBOT_USER }}"
          git config --global user.email "${{ secrets.GH_SYNC_EMAIL || secrets.PX4BUILDBOT_EMAIL }}"

      - name: Clone PX4_msgs repo
        run: |
          git clone https://${{ secrets.GH_SYNC_TOKEN || secrets.PX4BUILTBOT_PERSONAL_ACCESS_TOKEN }}@github.com/${PX4_MSGS_REPO}.git

      - name: Check out the same branch as the PX4 repo
        run: |
          cd px4_msgs
          if git checkout ${{ github.ref_name }}; then
            echo "Checked out existing branch"
          else
            git checkout -b ${{ github.ref_name }}
          fi

      - name: Copy ROS 2 messages
        run: |
          rm -f px4_msgs/msg/*.msg
          rm -f px4_msgs/msg/versioned/*.msg
          rm -f px4_msgs/srv/*.srv
          rm -f px4_msgs/srv/versioned/*.srv
          cp msg/*.msg px4_msgs/msg/
          cp msg/versioned/*.msg px4_msgs/msg/ || true
          cp srv/*.srv px4_msgs/srv/
          cp srv/versioned/*.srv px4_msgs/srv/ || true

      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd px4_msgs
          git add -A
          git status
          if git diff --staged --quiet; then
            echo 'No ROS 2 message changes to publish (tree matches PX4 snapshot).'
            exit 0
          fi

          git commit -m "Update to PX4 ${{ github.sha }}"
          if ! git push origin "${{ github.ref_name }}"; then
            echo "::error::git push failed (HTTP 403). PAT cannot write to ${{ env.PX4_MSGS_REPO }}. Use secret GH_SYNC_TOKEN with classic repo scope or fine-grained Contents Read/Write on that repository."
            exit 1
          fi
          cd ..
          rm -rf px4_msgs
