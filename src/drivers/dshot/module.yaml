module_name: DShot Driver
serial_config:
    - command: dshot telemetry -d ${SERIAL_DEV}
      port_config_param:
        name: DSHOT_TEL_CFG
        group: DShot

parameters:
    - group: DShot
      definitions:
        DSHOT_ESC_TYPE:
          description:
            short: ESC Type
            long: The ESC firmware type
          type: enum
          values:
            0: Unknown
            1: AM32
          default: 0
        DSHOT_MIN:
            description:
                short: Minimum DShot Motor Output
                long: |
                    Minimum Output Value for DShot in percent of the full DShot throttle range
                    (not of DSHOT_MOT_LIM). The value depends on the ESC. Make sure to set this
                    high enough so that the motors are always spinning while armed.
            type: float
            unit: norm
            min: 0
            max: 1
            decimal: 2
            increment: 0.01
            default: 0.055
        DSHOT_MOT_LIM:
            description:
                short: DShot Motor Output Limit
                long: |
                    Scales the top of the unidirectional DShot throttle range (Betaflight-style
                    motor output limit). Mixer command 1.0 maps to this fraction of full DShot
                    codes. Default 1.0 leaves stock behavior.

                    Does not change DSHOT_MIN (idle stays absolute on the full-scale base).
                    Not applied to 3D / reversible outputs.

                    Keep MPC_THR_HOVER as the hover fraction of full (unscaled) ESC; controllers
                    and the hover thrust estimator automatically use
                    MPC_THR_HOVER / DSHOT_MOT_LIM (e.g. 0.21 / 0.61 ≈ 0.34). Retune external
                    thrust models (Newtons at actuator 1.0) to match the limited top end.
            type: float
            unit: norm
            min: 0.1
            max: 1
            decimal: 2
            increment: 0.01
            default: 1.0
        DSHOT_3D_ENABLE:
            description:
                short: Allows for 3d mode when using DShot and suitable mixer
                long: |
                    WARNING: ESC must be configured for 3D mode, and DSHOT_MIN set to 0.
                    This splits the throttle ranges in two.
                    Direction 1) 48 is the slowest, 1047 is the fastest.
                    Direction 2) 1049 is the slowest, 2047 is the fastest.
                    When mixer outputs 1000 or value inside DSHOT 3D deadband, DShot 0 is sent.
            type: boolean
            default: 0
        DSHOT_BIDIR_EDT:
            description:
                short: Enable Extended DShot Telemetry
                long: |
                    This parameter enables Extended DShot Telemetry which allows transmission of
                    additional telemetry within the eRPM frame. The EDT data is interleaved with
                    the eRPM frames at a low rate.
            type: boolean
            default: 0
            reboot_required: true
        DSHOT_3D_DEAD_H:
            description:
                short: DSHOT 3D deadband high
                long: |
                    When the actuator_output is between DSHOT_3D_DEAD_L and DSHOT_3D_DEAD_H, motor will not spin.
                    This value is with respect to the mixer_module range (0-1999), not the DSHOT values.
            type: int32
            min: 1000
            max: 1999
            default: 1000
        DSHOT_3D_DEAD_L:
            description:
                short: DSHOT 3D deadband low
                long: |
                    When the actuator_output is between DSHOT_3D_DEAD_L and DSHOT_3D_DEAD_H, motor will not spin.
                    This value is with respect to the mixer_module range (0-1999), not the DSHOT values.
            type: int32
            min: 0
            max: 1000
            default: 1000
        DSHOT_MOT_POL${i}:
            description:
                short: Number of magnetic poles of motor ${i}
                long: |
                    Number of magnetic poles for motor ${i}.
                    Required to compute RPM from the eRPM returned by ESC telemetry.
                    Either get the number from the motor spec sheet or count the magnets
                    on the bell of the motor (not the stator magnets).
                    Typical motors for 5 inch props have 14 poles.
            type: int32
            default: 14
            min: 2
            max: 400
            num_instances: 12
            instance_start: 1
